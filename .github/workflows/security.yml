# ============================================================
# 安全扫描 · 代码与依赖
# ------------------------------------------------------------------
# 两个独立的扫描器，互补关系：
#   · CodeQL —— 读**我们自己写的代码**，找注入、路径穿越、XSS 这类逻辑漏洞；
#               这个项目有一批"把用户输入拼进命令/路径"的地方（宝塔、Docker、证书路径），
#               正是 CodeQL 擅长的场景。
#   · Trivy  —— 读**依赖与配置**，找 CVE、Dockerfile/compose 的配置问题、误提交的密钥。
#
# ⚠️ 现在是「只报告不拦路」（trivy exit-code 0）：
#    首次接入没做过基线，直接拦会把 CI 常年标红，最后所有人都学会忽略它。
#    正确顺序是先看清存量问题 → 修掉关键的 → 再把 exit-code 改成 1 转为强制。
#    结果统一进 GitHub 的 Security → Code scanning 面板，不用去翻日志。
#
# ⚠️ Trivy 走官方 action 而不是手写 `docker run aquasecurity/trivy`：
#    第一版就是那么写的，在 GitHub runner 上两步都秒挂（拉镜像那一步没起来）。
#    action 自己下载 trivy 二进制来跑，不依赖 Docker Hub 匿名拉取，
#    也省掉缓存目录、SARIF 输出路径这些手工拼装的坑。
#
# 为什么每周还要跑一次：CVE 是**新披露**的 —— 代码一行没改，
# 昨天干净的依赖今天可能就中招了。只在 push 时跑会漏掉这种情况。
# ============================================================
name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # 每周一 09:00（北京时间）跑一次，与 Dependabot 的开 PR 时间对齐
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- 1. CodeQL：静态代码分析 ----------------
  codeql:
    name: CodeQL 代码分析
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          # 前后端都是 JS，一个语言即可覆盖
          languages: javascript-typescript
          # security-and-quality 比默认多查一类「可维护性」问题
          queries: security-and-quality

      - name: 分析并上传结果
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  # ---------------- 2. Trivy：依赖 / 配置 / 密钥 ----------------
  trivy:
    name: Trivy 依赖与配置扫描
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: 扫描并生成 SARIF（依赖漏洞 + Dockerfile/compose 配置 + 明文密钥）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          # 只报「有修复版本」的问题：没有升级路径的漏洞只会制造焦虑，
          # 又没法处理（这类要靠换基础镜像或等上游，不该天天提醒）
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          # 只报告不拦路，见文件头说明
          exit-code: '0'
          skip-dirs: node_modules,dist,backend/public

      - name: 上传到 Security 面板
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
