# ============================================================
# CI · 提交即检查
# ------------------------------------------------------------------
# 为什么要有这个：本轮就是靠这类机械检查逮到「两个对象展开合并时同名字段互相覆盖」
# 那种肉眼看不出来的 bug。人写代码会漏，机器不会。
#
# 四个 job 互相独立，哪个挂了一眼能看出是哪一层的问题：
#   1. lint           —— ESLint（正确性）+ Prettier（格式）+ 提交信息规范
#   2. backend-syntax —— 纯语法检查，不装依赖，几秒钟出结果
#   3. mcp-tools      —— 装后端依赖，验证「工具总数与分组一致」（防文档漂移）
#   4. frontend-build —— 真跑一次 vite build，前端类型/引用错误在这里暴露
#
# 分工：ESLint 只管「写错会出 bug」，Prettier 只管「长什么样」，
#      两者靠 eslint-config-prettier 解耦，不会互相纠正。
# ============================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------- 1. 代码规范（ESLint + Prettier + 提交信息） ----------------
  lint:
    name: 规范检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint 要读提交历史，默认的浅克隆只有 1 个提交，会校验失败
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装仓库级工具（ESLint / Prettier / commitlint）
        run: npm install --no-audit --no-fund --registry=https://registry.npmmirror.com

      - name: Prettier 格式检查
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: 提交信息规范（Conventional Commits）
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM="${{ github.event.pull_request.base.sha }}"
            TO="${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            case "$BEFORE" in
              ''|0000000000000000000000000000000000000000)
                # 新建分支 / 首次推送：before 是全 0，退回只校验本次 HEAD
                FROM="HEAD~1"; TO="HEAD" ;;
              *)
                FROM="$BEFORE"; TO="${{ github.sha }}" ;;
            esac
          fi
          echo "校验范围：$FROM..$TO"
          # 分支刚建立时 HEAD~1 可能不存在，此时只需校验 HEAD 这一条
          if ! git rev-parse --verify --quiet "$FROM" >/dev/null; then
            echo "范围起点不存在，改为只校验 HEAD"
            npx commitlint --verbose <<< "$(git log -1 --pretty=%B)"
            exit 0
          fi
          npx commitlint --from "$FROM" --to "$TO" --verbose

  # ---------------- 2. 后端语法（快，不用装依赖） ----------------
  backend-syntax:
    name: 后端语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node --check 全部后端源码
        run: |
          set -e
          count=0
          for f in $(find backend/src -name '*.js' | sort); do
            node --check "$f"
            count=$((count + 1))
          done
          echo "✅ 已检查 $count 个文件，语法全部通过"

      - name: 必需的配置文件是否齐全
        run: |
          set -e
          for f in \
            backend/src/mcp/instructions.js \
            backend/src/mcp/tools.js \
            backend/src/services/health.js \
            backend/Dockerfile \
            frontend/Dockerfile \
            docker-compose.yml \
            .env.example ; do
            [ -f "$f" ] || { echo "❌ 缺少必需文件：$f"; exit 1; }
          done
          echo "✅ 必需文件齐全"

      - name: 路径白名单自检（防目录穿越到别的项目）
        # 配置快照功能会用「站点名 + 备份文件名」拼出服务器上的真实路径。
        # 宝塔那个配置目录里躺着**全服务器所有站点**的配置，一个 ../ 就能读到
        # 别的项目 —— 这条防线失效是没有任何征兆的，所以每次真正跑一遍断言。
        # 该脚本零依赖，所以在这个不装 node_modules 的 job 里也能跑。
        run: node backend/scripts/selfcheck-path-guards.js

      - name: 飞书签名自检（与官方 Python 示例逐字节比对）
        # 签名算错的表现是「推送一直失败」：不报错、不抛异常，对方静默拒收。
        # 所以把官方示例算出的固定值写死成期望值，让 Node 实现对齐。
        # 同样零依赖，不装 node_modules 也能跑。
        run: node backend/scripts/selfcheck-feishu-sign.js

      - name: 确保没有把真实密钥提交进来
        run: |
          set -e
          if [ -f .env ]; then
            echo "❌ 仓库里出现了 .env（真实密钥），必须移除"
            exit 1
          fi
          # 粗筛：常见的密钥字面量不该出现在源码里
          if grep -rn --include='*.js' --include='*.vue' --include='*.json' \
               -E '(sk-[A-Za-z0-9]{20,}|cfut_[A-Za-z0-9]{20,})' backend/src frontend/src 2>/dev/null; then
            echo "❌ 源码里疑似写入了明文密钥"
            exit 1
          fi
          echo "✅ 未发现明文密钥"

  # ---------------- 3. MCP 工具清单一致性 ----------------
  mcp-tools:
    name: MCP 工具分组自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装后端依赖
        working-directory: backend
        run: npm install --omit=dev --no-audit --no-fund --registry=https://registry.npmmirror.com

      - name: 工具总数与分组必须一致
        working-directory: backend
        run: |
          node -e "
            const { TOOL_DEFINITIONS } = require('./src/mcp/tools');
            const { TOOL_COUNT, TOOL_GROUPS, auditGroups, SERVER_INSTRUCTIONS } = require('./src/mcp/instructions');
            const a = auditGroups();
            console.log('注册工具数 =', TOOL_DEFINITIONS.length);
            console.log('推导工具数 =', TOOL_COUNT);
            console.log('分组数     =', TOOL_GROUPS.length);
            if (!a.ok) {
              console.error('❌ 分组与注册不一致');
              process.exit(1);
            }
            if (TOOL_COUNT !== TOOL_DEFINITIONS.length) {
              console.error('❌ 工具总数推导有误');
              process.exit(1);
            }
            // 说明书里的数字必须与实际一致（历史上手写过「28 个工具」忘了改）
            if (!SERVER_INSTRUCTIONS.includes(\`能力地图（\${TOOL_COUNT} 个工具\`)) {
              console.error('❌ 说明文字里的工具数与实际不符');
              process.exit(1);
            }
            console.log('✅ 工具清单、分组、说明文字三者一致');
          "

      - name: MCP 工具作用域自检（只读 / 写 必须归类完整）
        # 只读令牌的安全性全押在 tools.js 的 READONLY_TOOLS 白名单上。
        # 以后新增工具若忘了归类，这一条会直接红 —— 否则只读令牌要么悄悄多出
        # 一个写权限，要么少一个只读工具（AI 会以为工具不存在，绕路去做别的事）。
        # 需要真实工具清单，所以放在这个装了依赖的 job 里，不放不装依赖的 backend-syntax。
        working-directory: backend
        run: node scripts/selfcheck-mcp-scope.js

  # ---------------- 4. 前端构建 ----------------
  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装前端依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund --registry=https://registry.npmmirror.com

      - name: vite build
        working-directory: frontend
        run: npm run build

      - name: 产物体积报告
        working-directory: frontend
        run: |
          echo "=== 产物体积（gzip）==="
          find dist/assets -name '*.js' -o -name '*.css' | sort | while read f; do
            printf '%8s  %s\n' "$(gzip -c "$f" | wc -c | awk '{printf "%.1fKB", $1/1024}')" "$(basename "$f")"
          done
          TOTAL=$(find dist/assets -name '*.js' | xargs gzip -c | wc -c)
          echo "---"
          echo "JS 合计（gzip）：$(echo "$TOTAL" | awk '{printf "%.1fKB", $1/1024}')"

      - name: 首屏预算看门狗
        working-directory: frontend
        run: |
          # 首屏 = index.html 里 modulepreload/stylesheet 直接引用的那几个文件。
          # 这条是硬闸门：本轮就是从 427KB 压到 154KB 才解决「打开就卡一下」的，
          # 加预算防止后面有人不小心把大依赖又拽回入口。
          BUDGET_KB=220
          TOTAL=0
          for f in $(grep -oE 'assets/[A-Za-z0-9_.-]+\.(js|css)' dist/index.html | sort -u); do
            [ -f "dist/$f" ] || continue
            SZ=$(gzip -c "dist/$f" | wc -c)
            TOTAL=$((TOTAL + SZ))
          done
          KB=$(echo "$TOTAL" | awk '{printf "%.1f", $1/1024}')
          echo "首屏合计（gzip）：${KB}KB（预算 ${BUDGET_KB}KB）"
          awk -v v="$KB" -v b="$BUDGET_KB" 'BEGIN{ if (v+0 > b+0) { printf "❌ 超出首屏预算\n"; exit 1 } printf "✅ 在预算内\n" }'
