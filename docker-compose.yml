# ============================================================
# 艾哥SaaS工作台 · 一键部署编排
#   启动：docker compose up -d --build
#   停止：docker compose down
#   看日志：docker compose logs -f backend
# 说明：宝塔 Nginx 反向代理指向本机 8080（前端），前端 Nginx 再把 /api 转发给后端 3000
# ============================================================
services:
  # ---------------- 后端：REST API + MCP Server ----------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: aige/workbench-backend:latest
    container_name: aige-workbench-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=production
    ports:
      # REST API（宝塔反代也可直接指向这里，此时前端静态文件由后端一并托管）
      - '3000:3000'
      # MCP Server（SSE 传输，给 Trae 等 AI 工具连接）
      - '3001:3001'
    extra_hosts:
      # 容器内访问宿主机服务（如宝塔面板）用：https://host.docker.internal:端口
      - 'host.docker.internal:host-gateway'
    volumes:
      # Docker Socket：容器管理功能依赖它（只读挂载即可满足 API 调用）
      - /var/run/docker.sock:/var/run/docker.sock
      # SQLite 数据 + 部署应用的数据目录，持久化到宿主机 ./data
      - ./data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - aige-net

  # ---------------- 前端：Vue3 构建产物 + Nginx 托管 ----------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: aige/workbench-frontend:latest
    container_name: aige-workbench-frontend
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      # 宝塔反代指向这个端口：aige-saas-panel.miaocaieyc.com.cn -> localhost:8083
      # ⚠️ 默认给的是 8083 而不是 8080 —— 8080 在不少服务器上已被别的服务占用，
      #    部署前先用 `ss -lnt` 确认端口空闲，冲突时改这里的左侧数字即可。
      - '8083:80'
    depends_on:
      - backend
    networks:
      - aige-net

networks:
  aige-net:
    driver: bridge
