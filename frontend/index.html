<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15803d" />
    <meta name="description" content="艾哥 SaaS 工作台 —— 一台服务器，一个界面，一个 MCP：网站、域名、容器、应用部署统一管控。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>艾哥 SaaS 工作台</title>
    <!--
      主题预设：在框架加载前把 html 的 dark 类打好，避免刷新时白屏闪烁。
      与 stores/theme.js 使用同一个 localStorage key。
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('aige-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* 隐私模式下 localStorage 不可用，忽略即可 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
