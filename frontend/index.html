<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="艾哥 SaaS 工作台 —— 一台服务器，一个界面，一个 MCP：网站、域名、容器、应用部署统一管控，带自愈巡检与告警。" />

    <!-- ==================== 站点图标（浏览器标签页/收藏夹/桌面快捷方式）====================
         全部使用主人提供的整幅 logo，不做任何裁切。
         文件由 tools/gen-brand-icons.ps1 从 frontend/public/brand-logo.jpg 生成，
         换 logo 时替换 brand-logo.jpg 后重跑该脚本即可，不要手改生成的 PNG。 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- 分享到微信/飞书/GitHub 等处的链接预览卡片 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="艾哥 SaaS 工作台" />
    <meta property="og:description" content="一台服务器，一个界面，一个 MCP：网站、域名、容器、应用部署统一管控。" />
    <meta property="og:image" content="/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-cover.png" />

    <title>艾哥 SaaS 工作台</title>
    <!--
      主题预设：在框架加载前把 html 的 dark 类与 data-brand 打好，
      避免刷新时闪一下浅色/默认色。与 stores/theme.js 使用同一批 localStorage key。
      data-brand 有默认值：配色令牌都挂在 html[data-brand=...] 上，
      不打属性会退回 tokens.css 的兜底值。
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('aige-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.setAttribute('data-brand', localStorage.getItem('aige-brand') || 'teal');
        } catch (e) {
          /* 隐私模式下 localStorage 不可用，忽略即可 */
          document.documentElement.setAttribute('data-brand', 'teal');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
