# ============================================================
# 前端容器内的 Nginx 站点配置
#   静态资源：/usr/share/nginx/html（Vite 构建产物）
#   /api 与 /mcp-sse 反向代理到后端容器 backend:3000 / backend:3001
# 宝塔 Nginx 只需把域名反向代理到本容器的 80（宿主机 8080）即可。
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 普通接口的保守值：上传接口在下方单独放宽，此处保持不变
    client_max_body_size 20m;

    # ---------------- 安装包上传：单独放宽（只有这一条路径，其它接口沿用上面的 20m） ----------------
    # 为什么要放宽：APK 通常 15~80MB，20m 会直接 413。
    # 为什么停在 100m 而不是更大：**Cloudflare 免费版单次上传上限就是 100MB**
    #   （面板域名挂在 CF 后面），nginx 再宽也没意义；而且让 nginx 先拦下来，
    #   后端就不会为超大文件白缓冲一遍。后端还有一道同名上限做兜底。
    location = /api/distribute/upload {
        client_max_body_size 100m;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传 + 等蒲公英解析，最长可能几分钟
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # 边收边转发，不在 nginx 落临时文件
        proxy_request_buffering off;
    }

    # ---------------- gzip ----------------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # ---------------- 后端 API ----------------
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;   # 容器日志 SSE 需要关闭缓冲
    }

    # ---------------- MCP SSE（需要时可把 /mcp-sse 暴露出去） ----------------
    location /mcp-sse/ {
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_buffering off;
        chunked_transfer_encoding off;
    }

    # ---------------- 带 hash 的静态资源长缓存 ----------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------------- SPA 路由兜底 ----------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
